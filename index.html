<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>VOYX Sales Dashboard</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <style>

    /* =========================================================
       ROOT VARIABLES
    ========================================================= */

    :root {
      --bg-color: #f4f7fa;
      --card-bg: #ffffff;
      --dark-card-bg: #111827;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --accent-orange: #f97316;
      --border-color: #e5e7eb;
      --green: #16a34a;
      --red: #dc2626;
    }


    /* =========================================================
       GLOBAL
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

      font-family:
        'Segoe UI',
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }


    body {
      background-color: var(--bg-color);
      color: var(--text-main);

      padding: 20px;

      overflow-x: hidden;
    }


    .container {
      max-width: 1400px;

      margin: 0 auto;

      width: 100%;
    }


    /* =========================================================
       HEADER
    ========================================================= */

    .header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 24px;

      gap: 20px;
    }


    .logo {
      font-family: 'Orbitron', sans-serif;

      font-size: 27px;

      font-weight: 800;

      color: var(--accent-orange);

      letter-spacing: 2px;

      line-height: 1;
    }


    .logo span {
      color: var(--text-main);
    }


    .header-controls {
      display: flex;

      gap: 12px;

      align-items: center;

      flex-wrap: wrap;

      justify-content: flex-end;
    }


    .date-picker {
      padding: 8px 16px;

      border: 1px solid var(--border-color);

      border-radius: 20px;

      background: var(--card-bg);

      font-weight: 600;

      color: var(--text-muted);

      cursor: pointer;

      outline: none;
    }


    .btn {
      padding: 8px 16px;

      border-radius: 20px;

      font-weight: 600;

      font-size: 14px;

      border: none;

      cursor: pointer;
    }


    .btn-orange {
      background: var(--accent-orange);

      color: white;
    }


    .btn-outline {
      background: var(--card-bg);

      border: 1px solid var(--border-color);

      color: var(--text-main);
    }


    .btn-dark {
      background: #374151;

      color: white;
    }


    .btn:hover {
      opacity: 0.9;
    }


    .profile {
      text-align: right;

      font-size: 12px;

      margin-left: 10px;

      min-width: 120px;
    }


    .profile-name {
      font-size: 14px;

      font-weight: 700;

      color: var(--text-main);

      white-space: nowrap;
    }


    .profile-link {
      color: #0ea5e9;

      text-decoration: none;
    }


    /* =========================================================
       GRID
    ========================================================= */

    .grid-row-1 {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 20px;

      margin-bottom: 20px;

      width: 100%;
    }


    .grid-row-2 {
      display: grid;

      grid-template-columns:
        minmax(0, 2fr)
        minmax(0, 1fr);

      gap: 20px;

      margin-bottom: 20px;

      width: 100%;

      align-items: stretch;
    }


    .grid-row-3 {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

      gap: 20px;

      width: 100%;
    }


    /* =========================================================
       CARDS
    ========================================================= */

    .card {
      background: var(--card-bg);

      border-radius: 16px;

      padding: 24px;

      box-shadow:
        0 4px 6px -1px
        rgba(0, 0, 0, 0.05);

      min-width: 0;
    }


    .card-dark {
      background:
        linear-gradient(
          135deg,
          #0f172a,
          #1e293b
        );

      color: white;
    }


    .card-title {
      font-size: 11px;

      text-transform: uppercase;

      font-weight: 700;

      color: var(--text-muted);

      margin-bottom: 16px;
    }


    .card-dark .card-title {
      color: #94a3b8;
    }


    /* =========================================================
       KPI TITLES
    ========================================================= */

    .metric-card-title {
      display: flex;

      flex-direction: column;

      align-items: flex-start;

      gap: 7px;
    }


    .metric-icon {
      font-size: 12px;

      color: #6b7280;

      line-height: 1;
    }


    .metric-card-title span {
      display: block;

      line-height: 1.2;
    }


    /* =========================================================
       KPI VALUES
    ========================================================= */

    .metric-value {
      font-size: 36px;

      font-weight: 700;

      margin-bottom: 8px;
    }


    .card-dark .metric-value {
      color: var(--accent-orange);
    }


    .metric-sub {
      font-size: 14px;

      font-weight: 600;

      color: var(--text-muted);
    }


    .card-dark .metric-sub {
      color: #cbd5e1;
    }


    /* =========================================================
       TABLE
    ========================================================= */

    .leaderboard-card {
      min-width: 0;

      overflow: hidden;
    }


    .leaderboard-scroll {
      max-height: 350px;

      overflow-y: auto;

      overflow-x: auto;

      scrollbar-width: thin;
    }


    table {
      width: 100%;

      border-collapse: collapse;

      text-align: left;

      font-size: 13px;
    }


    th {
      color: var(--text-muted);

      font-weight: 600;

      padding-bottom: 12px;

      border-bottom:
        1px solid var(--border-color);

      white-space: nowrap;

      position: sticky;

      top: 0;

      background: white;

      z-index: 2;
    }


    td {
      padding: 12px 8px;

      border-bottom:
        1px solid #f3f4f6;

      font-weight: 500;

      white-space: nowrap;
    }


    td.highlight {
      color: var(--accent-orange);

      font-weight: bold;
    }


    td.green {
      color: var(--green);

      font-weight: bold;
    }


    /* =========================================================
       TOP PRODUCTS
    ========================================================= */

    .destination-card {
      min-width: 0;

      overflow: hidden;
    }


    .dest-list {
      list-style: none;

      display: flex;

      flex-direction: column;

      gap: 16px;

      max-height: 350px;

      overflow-y: auto;

      scrollbar-width: none;
    }


    .dest-list::-webkit-scrollbar {
      display: none;
    }


    .dest-item {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;

      font-size: 14px;

      color: #e2e8f0;

      font-weight: 500;

      min-width: 0;
    }


    .dest-item > span:first-child {
      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }


    .dest-badge {
      flex-shrink: 0;

      background: white;

      color: var(--dark-card-bg);

      padding: 4px 12px;

      border-radius: 12px;

      font-weight: bold;

      font-size: 13px;
    }


    /* =========================================================
       CHARTS
    ========================================================= */

    .chart-container {
      position: relative;

      height: 250px;

      width: 100%;

      max-width: 100%;

      overflow: hidden;
    }


    .chart-container canvas {
      max-width: 100% !important;
    }


    /* =========================================================
       STATUS MESSAGE
    ========================================================= */

    .status-message {
      position: fixed;

      right: 20px;

      bottom: 20px;

      padding: 12px 18px;

      background: #111827;

      color: white;

      border-radius: 10px;

      font-size: 13px;

      display: none;

      z-index: 9999;

      box-shadow:
        0 5px 20px
        rgba(0,0,0,0.15);
    }


    .status-message.error {
      background: #dc2626;
    }


    .status-message.success {
      background: #16a34a;
    }


    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 1200px) {

      .header {
        flex-wrap: wrap;
      }


      .grid-row-1 {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

    }


    @media (max-width: 1024px) {

      .grid-row-2,
      .grid-row-3 {
        grid-template-columns: 1fr;
      }

    }


    @media (max-width: 700px) {

      body {
        padding: 10px;
      }


      .grid-row-1 {
        grid-template-columns: 1fr;
      }


      .header {
        flex-direction: column;

        align-items: stretch;
      }


      .header-controls {
        justify-content: flex-start;
      }


      .profile {
        text-align: left;

        margin-left: 0;
      }


      .card {
        padding: 18px;
      }


      .leaderboard-scroll {
        overflow-x: auto;
      }


      .leaderboard-scroll table {
        min-width: 700px;
      }

    }

  </style>

</head>


<body>

  <div class="container">


    <!-- =====================================================

    <!-- =====================================================

      <!-- MTD -->

    <!-- =====================================================

    <div class="grid-row-2">

    <!-- =====================================================

  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>


    /* =========================================================
       SUPABASE CONFIGURATION
    ========================================================= */

    const SUPABASE_URL =
      "https://brvsaxflxgdnthtnhscc.supabase.co/rest/v1/rpc/get_sales_dashboard";


    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJydnNheGZseGdkbnRodG5oc2NjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MDYyOTYsImV4cCI6MjEwMjk4MjI5Nn0.6aQenXoMj6hbUBqyyUkf4DAIVONfLIojpUqtbEycT5s";


    /* =========================================================
       GLOBAL DATA
    ========================================================= */

    let currentDashboardData = null;



    /* =========================================================
       HELPER: CURRENCY
    ========================================================= */

    function formatCurrency(num) {

      const value =
        Number(num) || 0;


      return "₹" +
        value.toLocaleString(
          "en-IN",
          {
            minimumFractionDigits: 2,

            maximumFractionDigits: 2
          }
        );

    }



    /* =========================================================
       HELPER: HTML ESCAPE
    ========================================================= */

    function escapeHtml(value) {

      return String(value ?? "")

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }



    /* =========================================================
       STATUS MESSAGE
    ========================================================= */

    function showStatus(
      message,
      type = "success"
    ) {

      const status =
        document.getElementById(
          "statusMessage"
        );


      status.textContent =
        message;


      status.className =
        `status-message ${type}`;


      status.style.display =
        "block";


      setTimeout(
        () => {

          status.style.display =
            "none";

        },
        3000
      );

    }



    /* =========================================================
       CHART OPTIONS
    ========================================================= */

    const chartOptions = {

      responsive: true,

      maintainAspectRatio: false,


      plugins: {

        legend: {

          display: false

        }

      },


      scales: {

        x: {

          grid: {

            display: false

          },


          ticks: {

            maxRotation: 45,

            minRotation: 45

          }

        },


        y: {

          beginAtZero: true,


          grid: {

            color: "#f3f4f6"

          }

        }

      }

    };



    /* =========================================================
       DAILY CHART
    ========================================================= */

    const dailyChart =
      new Chart(

        document.getElementById(
          "dailyChart"
        ),

        {

          type: "line",


          data: {

            labels: [],


            datasets: [

              {

                label: "Orders",

                data: [],


                borderColor:
                  "#f97316",


                backgroundColor:
                  "rgba(249,115,22,0.08)",


                borderWidth: 2,


                fill: true,


                tension: 0.4,


                pointRadius: 4

              }

            ]

          },


          options:
            chartOptions

        }

      );



    /* =========================================================
       MONTHLY CHART
    ========================================================= */

    const monthlyChart =
      new Chart(

        document.getElementById(
          "monthlyChart"
        ),

        {

          type: "line",


          data: {

            labels: [],


            datasets: [

              {

                label: "Orders",

                data: [],


                borderColor:
                  "#374151",


                backgroundColor:
                  "rgba(55,65,81,0.08)",


                borderWidth: 2,


                fill: true,


                tension: 0.4,


                pointRadius: 4

              }

            ]

          },


          options:
            chartOptions

        }

      );



    /* =========================================================
       UPDATE KPI CARDS
       
       IMPORTANT:
       This matches your EXACT Supabase response:

       data.kpi.today_orders
       data.kpi.today_revenue
       etc.
    ========================================================= */

    function updateKpis(data) {

      const kpi =
        data.kpi || {};


      /* TODAY */

      document.getElementById(
        "todayOrders"
      ).innerHTML =

        `${kpi.today_orders ?? 0}

        <span
          style="
            font-size:16px;
            color:white;
          "
        >
          Orders
        </span>`;


      document.getElementById(
        "todayRevenue"
      ).textContent =

        `${formatCurrency(
          kpi.today_revenue
        )} Revenue`;



      /* MTD */

      document.getElementById(
        "mtdOrders"
      ).textContent =

        kpi.mtd_orders ?? 0;


      document.getElementById(
        "mtdRevenue"
      ).textContent =

        `${formatCurrency(
          kpi.mtd_revenue
        )} Revenue`;



      /* PREVIOUS MONTH SAME DAY */

      document.getElementById(
        "prevDayOrders"
      ).textContent =

        kpi.previous_month_same_day_orders
        ?? 0;


      document.getElementById(
        "prevDayRevenue"
      ).textContent =

        `${formatCurrency(
          kpi.previous_month_same_day_revenue
        )} Revenue`;



      /* PREVIOUS MONTH */

      document.getElementById(
        "prevMonthOrders"
      ).textContent =

        kpi.previous_month_orders
        ?? 0;


      document.getElementById(
        "prevMonthRevenue"
      ).textContent =

        `${formatCurrency(
          kpi.previous_month_revenue
        )} Revenue`;

    }



    /* =========================================================
       UPDATE DAILY CHART

       SUPABASE:
       daily_sales: [
         {
           day,
           orders,
           sales,
           discount,
           revenue
         }
       ]
    ========================================================= */

    function updateDailyChart(data) {

      const rows =
        Array.isArray(
          data.daily_sales
        )

          ? data.daily_sales

          : [];


      dailyChart.data.labels =

        rows.map(
          row =>
            `Day ${row.day}`
        );


      dailyChart.data.datasets[0].data =

        rows.map(
          row =>
            Number(
              row.orders
            ) || 0
        );


      dailyChart.update();

    }



    /* =========================================================
       UPDATE MONTHLY CHART

       SUPABASE:
       monthly_sales: [
         {
           month,
           orders,
           sales,
           discount,
           revenue
         }
       ]
    ========================================================= */

    function updateMonthlyChart(data) {

      const rows =
        Array.isArray(
          data.monthly_sales
        )

          ? data.monthly_sales

          : [];


      monthlyChart.data.labels =

        rows.map(
          row =>
            row.month
        );


      monthlyChart.data.datasets[0].data =

        rows.map(
          row =>
            Number(
              row.orders
            ) || 0
        );


      monthlyChart.update();

    }



    /* =========================================================
       UPDATE EMPLOYEE SALES

       SUPABASE:
       employee_sales: [
         {
           employee_id,
           employee_name,
           orders,
           sales,
           discount,
           revenue
         }
       ]
    ========================================================= */

    function updateEmployeeSales(data) {

      const body =
        document.getElementById(
          "leaderboardBody"
        );


      const employees =

        Array.isArray(
          data.employee_sales
        )

          ? data.employee_sales

          : [];


      if (
        employees.length === 0
      ) {

        body.innerHTML = `

          <tr>

            <td
              colspan="6"
              style="text-align:center;"
            >

              No employee sales data

            </td>

          </tr>

        `;


        return;

      }



      body.innerHTML =

        employees

          .map(
            (item, index) => `

              <tr>

                <td>
                  ${index + 1}
                </td>


                <td>
                  ${escapeHtml(
                    item.employee_name
                  )}
                </td>


                <td class="green">
                  ${item.orders ?? 0}
                </td>


                <td>
                  ${formatCurrency(
                    item.sales
                  )}
                </td>


                <td>
                  ${formatCurrency(
                    item.discount
                  )}
                </td>


                <td class="highlight">
                  ${formatCurrency(
                    item.revenue
                  )}
                </td>

              </tr>

            `
          )

          .join("");

    }



    /* =========================================================
       UPDATE TOP PRODUCTS

       SUPABASE:
       top_products: [
         {
           product_id,
           product_name,
           orders,
           revenue
         }
       ]
    ========================================================= */

    function updateTopProducts(data) {

      const list =
        document.getElementById(
          "destinationsList"
        );


      const products =

        Array.isArray(
          data.top_products
        )

          ? data.top_products

          : [];


      if (
        products.length === 0
      ) {

        list.innerHTML = `

          <li class="dest-item">

            <span>
              No product data
            </span>

          </li>

        `;


        return;

      }



      list.innerHTML =

        products

          .map(
            item => `

              <li
                class="dest-item"
                title="${escapeHtml(
                  item.product_name
                )}"
              >

                <span>

                  ${escapeHtml(
                    item.product_name
                  )}

                </span>


                <span
                  class="dest-badge"
                >

                  ${item.orders ?? 0}

                </span>

              </li>

            `
          )

          .join("");

    }



    /* =========================================================
       MAIN SUPABASE REQUEST

       THIS IS THE MOST IMPORTANT PART.

       Your Postman request returns:

       [
         {
           "dashboard_data": {
             "kpi": {...},
             "daily_sales": [...],
             "top_products": [...],
             "monthly_sales": [...],
             "employee_sales": [...]
           }
         }
       ]

    ========================================================= */

    async function updateDashboard(
      reportDate
    ) {

      console.log(
        "================================="
      );


      console.log(
        "DATE SENT:",
        reportDate
      );


      console.log(
        "SUPABASE URL:",
        SUPABASE_URL
      );


      try {


        /* =================================
           SEND REQUEST
        ================================= */

        const response =
          await fetch(

            SUPABASE_URL,

            {

              method: "POST",


              headers: {

                "Content-Type":
                  "application/json",


                /*
                 * Supabase API key
                 */

                "apikey":
                  SUPABASE_ANON_KEY,


                /*
                 * Supabase authorization
                 */

                "Authorization":
                  `Bearer ${SUPABASE_ANON_KEY}`

              },


              /*
               * IMPORTANT:
               *
               * Your PostgreSQL function parameter
               * is p_report_date.
               */

              body:
                JSON.stringify({

                  p_report_date:
                    reportDate

                })

            }

          );



        console.log(
          "HTTP STATUS:",
          response.status
        );



        /* =================================
           GET RESPONSE
        ================================= */

        const rawData =
          await response.json();


        console.log(
          "RAW SUPABASE RESPONSE:",
          rawData
        );



        /* =================================
           ERROR
        ================================= */

        if (
          !response.ok
        ) {

          console.error(
            "SUPABASE ERROR:",
            rawData
          );


          showStatus(
            "Supabase request failed",
            "error"
          );


          alert(
            "Supabase Error:\n\n" +
            JSON.stringify(
              rawData,
              null,
              2
            )
          );


          return;

        }



        /* =================================
           EXTRACT RESPONSE
        ================================= */

        const item =

          Array.isArray(
            rawData
          )

            ? rawData[0]

            : rawData;



        /*
         * Your response has:
         *
         * item.dashboard_data
         */

        const data =

          item?.dashboard_data

          || item

          || {};



        console.log(
          "DASHBOARD DATA:",
          data
        );



        /* =================================
           SAVE DATA
        ================================= */

        currentDashboardData =
          data;



        /* =================================
           UPDATE EVERYTHING
        ================================= */

        updateKpis(
          data
        );


        updateEmployeeSales(
          data
        );


        updateTopProducts(
          data
        );


        updateDailyChart(
          data
        );


        updateMonthlyChart(
          data
        );



        /* =================================
           SUCCESS
        ================================= */

        showStatus(
          "Dashboard updated successfully",
          "success"
        );


        console.log(
          "Dashboard updated successfully."
        );


        console.log(
          "================================="
        );

      }


      catch (
        error
      ) {

        console.error(
          "FETCH ERROR:",
          error
        );


        showStatus(
          "Could not connect to Supabase",
          "error"
        );


        alert(
          "Connection Error:\n\n" +
          error.message
        );

      }

    }



    /* =========================================================
       UPDATE MONTH TITLE
    ========================================================= */

    function updateMtdTitle(
      reportDate
    ) {

      if (
        !reportDate
      ) {

        return;

      }


      const date =
        new Date(
          reportDate +
          "T00:00:00"
        );


      const monthName =

        date.toLocaleString(
          "en-US",
          {
            month: "long"
          }
        )
        .toUpperCase();


      document.getElementById(
        "mtdTitle"
      ).textContent =

        `${monthName} MTD`;

    }



    /* =========================================================
       DATE PICKER
    ========================================================= */

    const datePicker =
      document.getElementById(
        "reportDate"
      );


    datePicker.addEventListener(
      "change",

      function () {

        const selectedDate =
          this.value;


        if (
          !selectedDate
        ) {

          return;

        }


        updateMtdTitle(
          selectedDate
        );


        updateDashboard(
          selectedDate
        );

      }

    );



    /* =========================================================
       DASHBOARD BUTTON
    ========================================================= */

    document
      .getElementById(
        "dashboardBtn"
      )
      .addEventListener(
        "click",

        function () {

          updateDashboard(
            datePicker.value
          );

        }
      );



    /* =========================================================
       WALLET BUTTON
    ========================================================= */

    document
      .getElementById(
        "walletBtn"
      )
      .addEventListener(
        "click",

        function () {

          alert(
            "Wallet Summary is not connected yet."
          );

        }
      );



    /* =========================================================
       CSV DOWNLOAD
    ========================================================= */

    function downloadCSV() {


      if (
        !currentDashboardData
      ) {

        alert(
          "Dashboard data is not loaded yet."
        );


        return;

      }


      const data =
        currentDashboardData;


      const kpi =
        data.kpi || {};


      const reportDate =
        datePicker.value;


      const rows = [];



      /* =================================
         TITLE
      ================================= */

      rows.push([
        "VOYX SALES DASHBOARD"
      ]);


      rows.push([
        "Report Date",
        reportDate
      ]);


      rows.push([]);



      /* =================================
         KPI
      ================================= */

      rows.push([
        "KPI"
      ]);


      rows.push([
        "Metric",
        "Value"
      ]);


      rows.push([
        "Today Orders",
        kpi.today_orders ?? 0
      ]);


      rows.push([
        "Today Sales",
        kpi.today_sales ?? 0
      ]);


      rows.push([
        "Today Discount",
        kpi.today_discount ?? 0
      ]);


      rows.push([
        "Today Revenue",
        kpi.today_revenue ?? 0
      ]);


      rows.push([
        "MTD Orders",
        kpi.mtd_orders ?? 0
      ]);


      rows.push([
        "MTD Sales",
        kpi.mtd_sales ?? 0
      ]);


      rows.push([
        "MTD Discount",
        kpi.mtd_discount ?? 0
      ]);


      rows.push([
        "MTD Revenue",
        kpi.mtd_revenue ?? 0
      ]);


      rows.push([
        "MTD Average Order Value",
        kpi.mtd_average_order_value ?? 0
      ]);


      rows.push([
        "Previous Month Orders",
        kpi.previous_month_orders ?? 0
      ]);


      rows.push([
        "Previous Month Sales",
        kpi.previous_month_sales ?? 0
      ]);


      rows.push([
        "Previous Month Discount",
        kpi.previous_month_discount ?? 0
      ]);


      rows.push([
        "Previous Month Revenue",
        kpi.previous_month_revenue ?? 0
      ]);


      rows.push([
        "Previous Month Same Day Orders",
        kpi.previous_month_same_day_orders ?? 0
      ]);


      rows.push([
        "Previous Month Same Day Revenue",
        kpi.previous_month_same_day_revenue ?? 0
      ]);


      rows.push([]);



      /* =================================
         DAILY SALES
      ================================= */

      rows.push([
        "DAILY SALES"
      ]);


      rows.push([
        "Day",
        "Orders",
        "Sales",
        "Discount",
        "Revenue"
      ]);


      (
        data.daily_sales || []
      ).forEach(
        item => {

          rows.push([

            item.day ?? "",

            item.orders ?? 0,

            item.sales ?? 0,

            item.discount ?? 0,

            item.revenue ?? 0

          ]);

        }
      );


      rows.push([]);



      /* =================================
         TOP PRODUCTS
      ================================= */

      rows.push([
        "TOP PRODUCTS"
      ]);


      rows.push([
        "Product ID",
        "Product Name",
        "Orders",
        "Revenue"
      ]);


      (
        data.top_products || []
      ).forEach(
        item => {

          rows.push([

            item.product_id ?? "",

            item.product_name ?? "",

            item.orders ?? 0,

            item.revenue ?? 0

          ]);

        }
      );


      rows.push([]);



      /* =================================
         MONTHLY SALES
      ================================= */

      rows.push([
        "MONTHLY SALES"
      ]);


      rows.push([
        "Month",
        "Orders",
        "Sales",
        "Discount",
        "Revenue"
      ]);


      (
        data.monthly_sales || []
      ).forEach(
        item => {

          rows.push([

            item.month ?? "",

            item.orders ?? 0,

            item.sales ?? 0,

            item.discount ?? 0,

            item.revenue ?? 0

          ]);

        }
      );


      rows.push([]);



      /* =================================
         EMPLOYEE SALES
      ================================= */

      rows.push([
        "EMPLOYEE SALES"
      ]);


      rows.push([
        "Employee ID",
        "Employee Name",
        "Orders",
        "Sales",
        "Discount",
        "Revenue"
      ]);


      (
        data.employee_sales || []
      ).forEach(
        item => {

          rows.push([

            item.employee_id ?? "",

            item.employee_name ?? "",

            item.orders ?? 0,

            item.sales ?? 0,

            item.discount ?? 0,

            item.revenue ?? 0

          ]);

        }
      );



      /* =================================
         CREATE CSV
      ================================= */

      const csv =

        rows

          .map(
            row =>

              row

                .map(
                  value => {

                    const text =
                      String(
                        value ?? ""
                      );


                    return `"${text.replace(
                      /"/g,
                      '""'
                    )}"`;

                  }
                )

                .join(",")

          )

          .join("\n");



      /* =================================
         DOWNLOAD
      ================================= */

      const blob =
        new Blob(
          [csv],
          {
            type:
              "text/csv;charset=utf-8;"
          }
        );


      const url =
        URL.createObjectURL(
          blob
        );


      const link =
        document.createElement(
          "a"
        );


      link.href =
        url;


      link.download =
        `VOYX_Dashboard_${reportDate}.csv`;


      document.body.appendChild(
        link
      );


      link.click();


      document.body.removeChild(
        link
      );


      URL.revokeObjectURL(
        url
      );



      showStatus(
        "CSV downloaded successfully",
        "success"
      );

    }



    /* =========================================================
       CSV BUTTON
    ========================================================= */

    document
      .getElementById(
        "downloadCsvBtn"
      )
      .addEventListener(
        "click",
        downloadCSV
      );



    /* =========================================================
       INITIAL LOAD
    ========================================================= */

    updateMtdTitle(
      datePicker.value
    );


    updateDashboard(
      datePicker.value
    );


  </script>

</body>
</html>
